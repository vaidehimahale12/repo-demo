<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Hero Face Match</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Heroes</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="tagline">Which Marvel Hero Do You Look Like?</h1>
                <div class="arc-reactor-container">
                    <div class="arc-reactor">
                        <div class="arc-reactor-core"></div>
                    </div>
                    <button class="upload-button">
                        <span>Upload Your Photo</span>
                    </button>
                </div>
            </div>
            <div class="hologram-panels">
                <div class="hologram-panel" id="iron-man"><div class="hologram-name">Iron Man</div></div>
                <div class="hologram-panel" id="thor"><div class="hologram-name">Thor</div></div>
                <div class="hologram-panel" id="captain-marvel"><div class="hologram-name">Captain Marvel</div></div>
                <div class="hologram-panel" id="loki"><div class="hologram-name">Loki</div></div>
                <div class="hologram-panel" id="black-widow"><div class="hologram-name">Black Widow</div></div>
                <div class="hologram-panel" id="doctor-strange"><div class="hologram-name">Doctor Strange</div></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Marvel Entertainment. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
